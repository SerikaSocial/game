[preset.1]

name="Windows Desktop"
platform="Windows Desktop"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="*.ska, *.gdshader, *.json, *.jpg, *.png, *.svg, bin/ffmpeg.exe, bin/yt-dlp.exe, bin/discord_partner_sdk.dll"
; The godotopenxrvendors extension is excluded: it exists to add Android vendor AARs
; (Meta/Pico/…) for the Quest builds and has no Windows-desktop role — PCVR uses Godot's
; built-in OpenXR only. On Windows it always shipped with no vendor selected, the exact
; state its .gdextension comment calls segfault-prone, and it loads at boot on any
; machine with an OpenXR runtime. Nothing in C# references it.
exclude_filter="Net/Codec/Tests/*, proto/*, *.sln, *.csproj, Launcher/*, addons/godotopenxrvendors/*"
export_path="../dist/windows/SerikaSocial.exe"
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

